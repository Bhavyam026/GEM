name: GeM Mumbai-Palghar-Boisar scan
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gem-scan.yml"
      - "scripts/scan_gem.py"
      - "scripts/pdf_extract.py"
      - "tests/test_scan_gem.py"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    # 09:00 to 18:00 IST = 03:30 to 12:30 UTC, Monday-Saturday
    - cron: "30 3-12 * * 1-6"
permissions:
  contents: write
  actions: write
concurrency:
  group: gem-tender-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scanner unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan public GeM ongoing bids
        run: python scripts/scan_gem.py
      - name: Commit tender data and scan status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GeM tender scan data"
            git push
            gh workflow run pages.yml --ref main
          fi
