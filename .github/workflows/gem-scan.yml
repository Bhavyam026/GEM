name: GeM Mumbai-Palghar-Boisar scan
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gem-tender-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scanner unit tests
        run: python -m unittest discover -s tests -v
      - name: Diagnose official GeM public connectivity
        run: |
          python - <<'PY'
          import socket
          host = "bidplus.gem.gov.in"
          print("DNS lookup:", host)
          try:
              for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM):
                  print("Resolved:", item[4][0])
          except Exception as exc:
              print("DNS ERROR:", repr(exc))
          print("TCP 443 checks:")
          try:
              addresses = sorted({x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
          except Exception:
              addresses = []
          for address in addresses:
              family = socket.AF_INET6 if ":" in address else socket.AF_INET
              sock = socket.socket(family, socket.SOCK_STREAM)
              sock.settimeout(12)
              try:
                  sock.connect((address, 443))
                  print(address, "TCP CONNECTED")
              except Exception as exc:
                  print(address, "TCP FAILED:", repr(exc))
              finally:
                  sock.close()
          PY
          echo "IPv4 HTTPS probe:"
          curl -4 -sS -I --connect-timeout 12 --max-time 20 https://bidplus.gem.gov.in/advance-search || true
          echo "Default HTTPS probe:"
          curl -sS -I --connect-timeout 12 --max-time 20 https://bidplus.gem.gov.in/advance-search || true
      - name: Scan public GeM ongoing bids
        run: python scripts/scan_gem.py
      - name: Commit tender data and scan status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/status.json
          mkdir -p data/pdfs
          git add -A data/pdfs/
          if ! git diff --cached --quiet; then
            git commit -m "Update GeM tender scan data"
            git pull --rebase -X theirs origin main
            git push
            gh workflow run pages.yml --ref main
          fi
