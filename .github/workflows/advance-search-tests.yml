name: GeM Advance Search tests
on:
  push:
    branches: [main, fix/advance-search-api]
    paths:
      - ".github/workflows/advance-search-tests.yml"
      - "scripts/scan_gem.py"
      - "scripts/pdf_extract.py"
      - "tests/test_scan_gem.py"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
